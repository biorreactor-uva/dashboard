name: Keep Supabase alive
on:
  schedule:
    - cron: '0 9 */2 * *'  # cada 2 días a las 9:00 UTC
  workflow_dispatch:        # permite ejecución manual
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase con escritura
        run: |
          curl -s -X POST \
            "https://xxqsxspxzmpiyihefdpx.supabase.co/rest/v1/sesiones" \
            -H "apikey: sb_publishable_eWprfzTeOlHhJ8K2KoA-bg_8EqkRlBe" \
            -H "Authorization: Bearer sb_publishable_eWprfzTeOlHhJ8K2KoA-bg_8EqkRlBe" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d '{"session_id":"keepalive_ping","start_ts":0,"ended":true}'
